name: Flygammon CTF solver
on:
  push:
    branches: ['arena/a7ffeaae-nhgjhgolikuj']
    paths:
      - 'solver/**'
      - '.github/workflows/flygammon.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  solve:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install web3 numpy sympy
      - name: Inspect and solve the supplied CTF instance
        env:
          # This is the instance-specific player key published by the CTF server.
          FLYGAMMON_PLAYER_KEY: '0x046ee8b4e8e54ef4476f7c9afa6889fc6c9f891d2c8bf4c779a1ed41c6517586'
          FLYGAMMON_RPC: 'https://ib5nooepv698758z.instances.ctfcup.online'
          FLYGAMMON_MAX_GAMES: '30'
        run: |
          set -o pipefail
          python -u solver/solve.py 2>&1 | tee solver-log.txt
      - name: Save diagnostics on the Arena branch
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for f in chain-state.json chain-logs.json solve-result.json solve-progress.json solver-log.txt tx-dump.json; do
            if [ -f "$f" ]; then git add -f "$f"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m 'Save Flygammon solver diagnostics'
            git push origin HEAD:arena/a7ffeaae-nhgjhgolikuj
          fi
