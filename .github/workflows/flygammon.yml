name: Flygammon CTF solver
on:
  push:
    branches: ['arena/a7ffeaae-nhgjhgolikuj']
    paths:
      - 'solver/**'
      - '.github/workflows/flygammon.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  solve:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install web3 numpy sympy
      - name: Inspect and solve the supplied CTF instance
        env:
          # This is the instance-specific player key published by the CTF server.
          FLYGAMMON_PLAYER_KEY: '0xbc2a568c6d7270611bd13e49e862ac7e5c92e79a18fbc616f65c0d6aa8d6dbcc'
        run: |
          if [ -f solver/solve.py ]; then python -u solver/solve.py; else python -u solver/inspect_chain.py; fi
      - name: Save diagnostics on the Arena branch
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f chain-state.json chain-logs.json solve-result.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m 'Save Flygammon solver diagnostics'
            git push origin HEAD:arena/a7ffeaae-nhgjhgolikuj
          fi
